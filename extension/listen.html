<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneLingo</title>
<link rel="stylesheet" href="ui.css?v=0.20.0">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/128.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SceneLingo">
<meta name="theme-color" content="#0d1117">
<style>
  .app { max-width: 820px; margin: 0 auto; padding: 14px 22px 28px; display: grid; gap: 16px; }

  /* ---- the bar on top ---- */
  .topbar { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  .bar { flex: 1; min-width: 80px; height: 6px; border-radius: 6px; background: var(--raised); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width 0.35s ease; }
  .topbar a.btn { text-decoration: none; }
  #count { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- the card ---- */
  .card { border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .inner { padding: 28px 36px 26px; }
  .cardhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; color: var(--muted); font-size: 12.5px; }
  .link { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; background: none; color: var(--accent-text); cursor: pointer; font-size: 12.5px; }
  .link:hover { text-decoration: underline; }

  .player { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 22px 0 6px; }
  .play { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-size: 30px; box-shadow: 0 6px 18px var(--accent-soft); transition: transform 0.1s, filter 0.15s; }
  .play:hover { filter: brightness(1.08); }
  .play:active { transform: scale(0.96); }
  .play.on { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .round { height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 13px; font-weight: 650; }
  .round:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
  .times { text-align: center; color: var(--muted); font-size: 12.5px; min-height: 18px; }

  .mask { margin-top: 14px; font: 600 17px/1.5 "Cascadia Mono", Consolas, monospace; letter-spacing: 0.06em; color: var(--accent-text); text-align: center; overflow-wrap: anywhere; }
  textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 16px; min-height: 92px; padding: 12px 14px; font-size: 18px; line-height: 1.45; border-radius: 12px; border: 1.5px solid var(--border-strong); background: var(--surface-2); outline: none; resize: none; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea:disabled { opacity: 0.6; }

  /* what was heard, word by word */
  .result { margin-top: 20px; animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .scorebar { display: flex; align-items: center; gap: 10px; }
  .verdict { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; }
  .verdict.right { color: var(--green); background: var(--green-soft); }
  .verdict.close { color: var(--gold); background: var(--gold-soft); }
  .verdict.wrong { color: var(--red); background: var(--red-soft); }
  .heard { margin-top: 14px; font-size: clamp(19px, 2.2vw, 23px); line-height: 1.9; }
  .heard span { padding: 1px 3px; border-radius: 5px; }
  .heard .close { background: var(--gold-soft); color: var(--gold); }
  .heard .wrong, .heard .missed { background: var(--red-soft); color: var(--red); font-weight: 650; }
  .heard .extra { color: var(--muted); text-decoration: line-through; }
  .heard s { color: var(--muted); font-size: 0.75em; margin-left: 4px; font-weight: 400; }
  .meaning { margin-top: 10px; font-size: 15px; font-style: italic; color: var(--text-2); }
  .word { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 13.5px; }
  .word b { color: var(--text); font-weight: 650; }
  .heard span[data-w] { cursor: pointer; }
  .heard span[data-w]:hover { text-decoration: underline dotted; text-underline-offset: 4px; }
  .parts { margin-top: 16px; }
  .parts .label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .parts .engine { font-size: 10px; font-weight: 750; letter-spacing: 0.06em; color: var(--accent-text); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; }
  .part { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 15px; }
  .part b { font-weight: 650; overflow-wrap: anywhere; }
  .part small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .part span { color: var(--gold); overflow-wrap: anywhere; }
  .star { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 17px; }
  .star:hover { background: var(--raised); color: var(--gold); }
  .star.on { color: var(--gold); }
  .tip { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* the buttons stay in sight when the answer makes the card longer than the screen */
  .actions { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 14px 36px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 18px 18px; }
  .actions .btn.primary { min-width: 170px; }
  .actions kbd { margin-left: 4px; }
  .actions .spacer { flex: 1; }

  /* ---- the end, and nothing to listen to ---- */
  .end { text-align: center; padding: 40px 30px; }
  .end .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .end h2 { margin: 6px 0 6px; font-size: 20px; }
  .end p { margin: 0 auto; max-width: 440px; color: var(--text-2); }
  .list { margin: 22px auto 0; max-width: 560px; display: grid; gap: 6px; text-align: left; }
  .list div { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: baseline; font-size: 14px; color: var(--text-2); }
  .list b { font-variant-numeric: tabular-nums; text-align: right; }
  .list b.right { color: var(--green); }
  .list b.close { color: var(--gold); }
  .list b.wrong { color: var(--red); }
  .end .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }

  @media (max-width: 640px) {
    .app { padding: 12px 12px 16px; }
    .topbar { flex-wrap: wrap; gap: 10px 12px; }
    .bar { order: 5; flex-basis: 100%; }
    .inner { padding: 20px 18px; }
    .actions { padding: 12px 18px; }
    .actions .btn.primary { flex: 1; min-width: 0; }
    .actions kbd { display: none; }
    .topbar a.btn .t { display: none; }
    .play { width: 68px; height: 68px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="icons/48.png" alt=""><h1 data-t="listenTitle"></h1></div>
    <div class="bar"><div id="bar"></div></div>
    <span id="count"></span>
    <a id="toReview" class="btn small ghost" href="review.html"></a>
    <a id="toWords" class="btn small ghost" href="words.html"></a>
  </header>

  <section id="card" class="card" hidden>
    <div class="inner">
      <div class="cardhead" id="head"></div>
      <div class="player">
        <button id="play" class="play"></button>
        <button id="slow" class="round">0.7×</button>
      </div>
      <div class="times" id="times"></div>
      <div class="mask" id="mask" hidden></div>
      <textarea id="typed" autocomplete="off" autocapitalize="sentences" spellcheck="false" data-t-placeholder="listenType"></textarea>
      <div id="result" class="result" hidden></div>
    </div>
    <div class="actions">
      <button id="hint" class="btn ghost"></button>
      <span class="spacer"></span>
      <button id="giveUp" class="btn ghost" data-t="dontKnow"></button>
      <button id="go" class="btn primary"></button>
    </div>
  </section>

  <section id="end" class="card end" hidden></section>
</div>

<!-- On the phone, where there is no extension, this stands in for it. -->
<script src="web.js?v=0.20.0"></script>
<script src="messages.js?v=0.20.0"></script>
<script src="shared.js?v=0.20.0"></script>
<script src="study.js?v=0.20.0"></script>
<script src="cloud.js?v=0.20.0"></script>
<script src="gemini.js?v=0.20.0"></script>
<script src="ui.js?v=0.20.0"></script>
<script src="listen.js?v=0.20.0"></script>
<!-- Text selected on this page is translated too: the content script does not run on the extension's own pages. -->
<script src="select.js?v=0.20.0"></script>
</body>
</html>
