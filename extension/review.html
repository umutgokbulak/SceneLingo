<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneLingo</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c232c;
    --raised: #21262d;
    --border: #30363d;
    --border-strong: #3d4651;
    --text: #e6edf3;
    --text-2: #b1bac4;
    --muted: #7d8590;
    --accent: #2f81f7;
    --accent-soft: rgba(47, 129, 247, 0.12);
    --accent-text: #79b8ff;
    --gold: #e3b341;
    --gold-soft: rgba(227, 179, 65, 0.12);
    --green: #3fb950;
    --green-soft: rgba(63, 185, 80, 0.12);
    --red: #f85149;
    --red-soft: rgba(248, 81, 73, 0.12);
    --mark: rgba(47, 129, 247, 0.28);
    --shadow: 0 16px 40px rgba(1, 4, 9, 0.45);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-2: #f6f8fa;
      --raised: #eef1f4;
      --border: #d8dee4;
      --border-strong: #c3cbd3;
      --text: #1f2328;
      --text-2: #424a53;
      --muted: #6e7781;
      --accent: #0969da;
      --accent-soft: rgba(9, 105, 218, 0.08);
      --accent-text: #0550ae;
      --gold: #9a6700;
      --gold-soft: rgba(154, 103, 0, 0.08);
      --green: #1a7f37;
      --green-soft: rgba(26, 127, 55, 0.08);
      --red: #cf222e;
      --red-soft: rgba(207, 34, 46, 0.08);
      --mark: rgba(9, 105, 218, 0.16);
      --shadow: 0 12px 30px rgba(31, 35, 40, 0.1);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* The whole page is one screen: a bar on top, the card and its panel under it. */
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); max-width: 1320px; margin: 0 auto; padding: 14px 20px 18px; gap: 14px; }

  /* ---- the bar on top ---- */
  .topbar { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  .progress { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 6px; border-radius: 6px; background: var(--raised); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #58a6ff); border-radius: 6px; transition: width 0.35s ease; }
  #progress { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #stats { display: flex; align-items: center; gap: 6px; flex: none; }
  .stat { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.fire b { color: var(--gold); }
  .daily { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; margin-left: 6px; }
  select { padding: 2px 6px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; }

  /* ---- the stage: the card, and the panel beside it ---- */
  .stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; }
  .stage.alone { grid-template-columns: minmax(0, 1fr); }
  .card, .side { min-height: 0; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .card { display: flex; flex-direction: column; overflow: hidden; }
  .scroll { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .scroll > .inner { margin: auto 0; padding: 26px 34px; }
  .scroll::-webkit-scrollbar, .tabbody::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb, .tabbody::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  /* the question */
  .q { text-align: center; }
  #top { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
  .kind { font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .chip { font-size: 11px; font-weight: 650; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-2); }
  .chip.level { color: var(--accent-text); border-color: var(--accent); background: var(--accent-soft); }
  .chip.academic { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .chip.hard { color: var(--red); border-color: var(--red); background: var(--red-soft); }
  .ask { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .headword { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .term { font-size: clamp(30px, 4.2vw, 46px); line-height: 1.12; font-weight: 750; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .term.long { font-size: clamp(20px, 2.2vw, 26px); font-weight: 600; letter-spacing: 0; }
  .term.meaning { color: var(--gold); font-weight: 650; font-size: clamp(26px, 3.2vw, 34px); }
  .ipa { color: var(--muted); font-size: 15px; }
  .ipa:empty { display: none; }
  .icon { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-size: 14px; transition: background 0.15s, border-color 0.15s; }
  .icon:hover { border-color: var(--accent); background: var(--accent-soft); }
  .quote { margin: 14px auto 0; max-width: 640px; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.55; }
  .quote b { font-weight: 650; background: var(--mark); border-radius: 5px; padding: 0 4px; }
  .quote input { width: auto; min-width: 5ch; margin: 0 2px; padding: 1px 8px; font-size: inherit; text-align: center; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--accent-soft); outline: none; }
  .source { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .hintline { margin: 8px auto 0; max-width: 560px; font-size: 15px; font-style: italic; color: var(--text-2); }
  .typed { display: flex; gap: 8px; justify-content: center; margin: 16px auto 0; max-width: 520px; }
  .typed input, .typed textarea { flex: 1; min-width: 0; padding: 10px 14px; font-size: 18px; text-align: center; border-radius: 12px; border: 1.5px solid var(--border-strong); background: var(--surface-2); outline: none; }
  .typed textarea { text-align: left; font-size: 16px; min-height: 72px; resize: none; }
  .typed input:focus, .typed textarea:focus, .quote input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .verdict { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; }
  .verdict.right { color: var(--green); background: var(--green-soft); }
  .verdict.close { color: var(--gold); background: var(--gold-soft); }
  .verdict.wrong { color: var(--red); background: var(--red-soft); }

  /* once answered, the question makes room */
  .card.revealed .q .term:not(.long):not(.meaning) { font-size: clamp(26px, 3vw, 34px); }
  .card.revealed .q .quote { margin-top: 10px; }

  /* the answer */
  .a { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--border-strong); text-align: center; animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .answerhead { margin-bottom: 14px; }
  .answerhead .term { font-size: clamp(24px, 2.6vw, 30px); }
  .m-label { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .m-main { margin-top: 2px; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.25; font-weight: 650; color: var(--gold); overflow-wrap: anywhere; }
  .m-phrase { color: var(--text); }
  .engine { display: inline-block; margin-left: 8px; vertical-align: middle; font-size: 9.5px; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; }
  .engine.gemini { color: var(--accent-text); border-color: var(--accent); }
  .m-note { margin: 6px auto 0; max-width: 560px; font-size: 14px; color: var(--text-2); }
  .m-dict { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .m-dict b { color: var(--text-2); font-weight: 600; }
  .m-ctx { margin: 10px auto 0; max-width: 600px; font-size: 15px; font-style: italic; color: var(--text-2); }
  .tools { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
  .edit { display: grid; gap: 12px; max-width: 460px; margin: 0 auto; text-align: left; }
  .edit label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .edit input { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); outline: none; }
  .edit input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* what is done with the card: always at its foot */
  .actions { flex: none; padding: 14px 20px 16px; border-top: 1px solid var(--border); background: var(--surface-2); display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .actions .btn.primary { min-width: 240px; padding: 11px 22px; font-size: 15px; }
  .grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 620px; }
  .grade { display: grid; gap: 1px; padding: 9px 8px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; text-align: center; transition: background 0.15s, border-color 0.15s, transform 0.05s; }
  .grade:active { transform: translateY(1px); }
  .grade .g { font-weight: 650; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
  .grade small { color: var(--muted); font-size: 12px; }
  #again .g { color: var(--red); }
  #again:hover { border-color: var(--red); background: var(--red-soft); }
  #good .g { color: var(--green); }
  #good:hover { border-color: var(--green); background: var(--green-soft); }
  #easy .g { color: var(--accent-text); }
  #easy:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---- the panel: practice, and the word in use ---- */
  .side { display: flex; flex-direction: column; overflow: hidden; }
  .side-wait { flex: 1; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 32px; text-align: center; color: var(--muted); }
  .side-wait .big { font-size: 34px; opacity: 0.6; }
  .side-wait p { margin: 0; max-width: 300px; }
  .own { flex: none; padding: 18px 20px 16px; border-bottom: 1px solid var(--border); }
  .own h3, .pane h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .own-row { display: flex; gap: 8px; }
  .own-row input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); outline: none; }
  .own-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ownResult { margin-top: 8px; display: grid; gap: 3px; font-size: 14px; color: var(--text-2); max-height: 96px; overflow: auto; }
  .ownResult:empty { display: none; }
  .ownResult .ok { color: var(--green); }
  .ownResult .fix { color: var(--text); }
  .tabs { flex: none; display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .n { margin-left: 6px; font-size: 11px; color: var(--muted); }
  .tabbody { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; }
  .pane p { margin: 0; }
  .pane .syn { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .list li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; }
  .list li:hover { background: var(--surface-2); }
  .list .t { flex: 1; min-width: 0; }
  .list .t small { display: block; color: var(--muted); font-size: 13px; }
  .play { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-size: 11px; }
  .play:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--raised); cursor: pointer; font-size: 14px; font-weight: 550; transition: background 0.15s, border-color 0.15s, transform 0.05s; }
  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.small { padding: 5px 11px; font-size: 13px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--raised); }
  .btn.danger:hover { color: var(--red); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  kbd { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid currentColor; font: 650 11px/18px "Segoe UI", system-ui, sans-serif; opacity: 0.6; text-align: center; }

  /* ---- nothing to do ---- */
  .empty { display: grid; place-content: center; justify-items: center; text-align: center; padding: 40px; }
  .empty .big { font-size: 46px; line-height: 1; color: var(--green); }
  .empty h2 { margin: 14px 0 6px; font-size: 22px; font-weight: 650; }
  .empty p { margin: 0 auto 20px; max-width: 460px; color: var(--text-2); }

  /* A narrow or short screen: one column, and the page scrolls. */
  @media (max-width: 900px), (max-height: 560px) {
    html, body { height: auto; }
    .app { height: auto; min-height: 100%; padding: 12px 12px 16px; }
    .topbar { flex-wrap: wrap; gap: 10px 14px; }
    .progress { order: 3; flex-basis: 100%; }
    #stats { flex: 1 1 100%; flex-wrap: wrap; min-width: 0; }
    .grade .g { font-size: 14px; }
    .stage { grid-template-columns: minmax(0, 1fr); }
    .scroll { overflow: visible; }
    .scroll > .inner { padding: 22px 18px; }
    .card { overflow: visible; }
    .actions { position: sticky; bottom: 0; border-radius: 0 0 18px 18px; }
    .side { overflow: visible; }
    .side-wait { display: none; }
    .side:has(> .side-wait:only-child) { display: none; }
    .tabbody { overflow: visible; }
    .actions .btn.primary { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="icons/48.png" alt=""><h1 data-t="reviewTitle"></h1></div>
    <div class="progress"><div class="bar"><div id="bar"></div></div><span id="progress"></span></div>
    <div id="stats"></div>
  </header>

  <main class="stage" id="stage">
    <section id="card" class="card" hidden>
      <div class="scroll"><div class="inner">
        <div class="q">
          <div id="top"></div>
          <div id="front"></div>
        </div>
        <div id="back" class="a" hidden></div>
      </div></div>
      <div class="actions">
        <button id="dontKnow" class="btn ghost" hidden></button>
        <button id="show" class="btn primary"></button>
        <div class="grades" id="grades" hidden>
          <button class="grade" id="again"><span class="g"><span data-t="again"></span><kbd>1</kbd></span><small></small></button>
          <button class="grade" id="good"><span class="g"><span data-t="good"></span><kbd>2</kbd></span><small></small></button>
          <button class="grade" id="easy"><span class="g"><span data-t="easy"></span><kbd>3</kbd></span><small></small></button>
        </div>
        <button id="countIt" class="btn ghost small" data-t="countIt" hidden></button>
      </div>
    </section>

    <aside id="side" class="side" hidden></aside>

    <section id="empty" class="card empty" hidden>
      <div class="big">✓</div>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
      <div><button id="studyAll" class="btn" hidden data-t="studyAll"></button></div>
    </section>
  </main>
</div>

<script src="messages.js"></script>
<script src="shared.js"></script>
<script src="study.js"></script>
<script src="core.js"></script>
<script src="review.js"></script>
<!-- Text selected on this page is translated too: the content script does not run on the extension's own pages. -->
<script src="select.js"></script>
</body>
</html>
