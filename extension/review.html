<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneLingo</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c232c;
    --raised: #21262d;
    --border: #30363d;
    --border-strong: #3d4651;
    --text: #e6edf3;
    --text-2: #b1bac4;
    --muted: #7d8590;
    --accent: #2f81f7;
    --accent-soft: rgba(47, 129, 247, 0.12);
    --accent-text: #79b8ff;
    --gold: #e3b341;
    --green: #3fb950;
    --green-soft: rgba(63, 185, 80, 0.12);
    --red: #f85149;
    --red-soft: rgba(248, 81, 73, 0.12);
    --mark: rgba(47, 129, 247, 0.28);
    --shadow: 0 12px 32px rgba(1, 4, 9, 0.45);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f6f8fa;
      --raised: #eef1f4;
      --border: #d8dee4;
      --border-strong: #c3cbd3;
      --text: #1f2328;
      --text-2: #424a53;
      --muted: #6e7781;
      --accent: #0969da;
      --accent-soft: rgba(9, 105, 218, 0.08);
      --accent-text: #0550ae;
      --gold: #9a6700;
      --green: #1a7f37;
      --green-soft: rgba(26, 127, 55, 0.08);
      --red: #cf222e;
      --red-soft: rgba(207, 34, 46, 0.08);
      --mark: rgba(9, 105, 218, 0.16);
      --shadow: 0 10px 28px rgba(31, 35, 40, 0.1);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 140px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---- header ---- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  #progress { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 4px; margin: 14px 0 12px; border-radius: 4px; background: var(--raised); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 0.35s ease; }
  #stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.fire b { color: var(--gold); }
  .daily { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); }

  /* ---- the card ---- */
  .card { border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  .front { padding: 28px 32px 26px; text-align: center; }
  #top { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
  .kind { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-2); letter-spacing: 0.02em; }
  .chip.level { color: var(--accent-text); border-color: var(--accent); background: var(--accent-soft); }
  .chip.academic { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .chip.hard { color: var(--red); border-color: var(--red); background: var(--red-soft); }
  .ask { margin-top: 14px; font-size: 14px; color: var(--muted); }
  .headword { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .term { font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .term.long { font-size: 24px; font-weight: 600; letter-spacing: 0; }
  .term.meaning { color: var(--gold); font-size: 32px; font-weight: 650; }
  .ipa { margin-top: 2px; color: var(--muted); font-size: 15px; }
  .ipa:empty { display: none; }
  .icon { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-size: 15px; transition: background 0.15s, border-color 0.15s; }
  .icon:hover { border-color: var(--accent); background: var(--accent-soft); }
  .quote { margin: 18px auto 0; max-width: 600px; font-size: 19px; line-height: 1.55; color: var(--text); }
  .quote b { font-weight: 650; background: var(--mark); border-radius: 5px; padding: 0 4px; }
  .quote input { width: auto; min-width: 5ch; margin: 0 2px; padding: 1px 8px; font-size: 18px; text-align: center; border-radius: 8px; border: 1.5px solid var(--accent); background: var(--accent-soft); outline: none; }
  .source { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .hintline { margin: 10px auto 0; max-width: 560px; font-size: 15px; font-style: italic; color: var(--text-2); }
  .typed { display: flex; gap: 8px; justify-content: center; align-items: stretch; margin: 18px auto 0; max-width: 520px; }
  .typed input, .typed textarea { flex: 1; min-width: 0; padding: 10px 14px; font-size: 18px; text-align: center; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--surface-2); outline: none; }
  .typed textarea { text-align: left; font-size: 16px; min-height: 76px; resize: vertical; }
  .typed input:focus, .typed textarea:focus, .quote input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .verdict { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 6px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 600; }
  .verdict.right { color: var(--green); background: var(--green-soft); }
  .verdict.close { color: var(--gold); background: rgba(227, 179, 65, 0.12); }
  .verdict.wrong { color: var(--red); background: var(--red-soft); }

  /* ---- the answer ---- */
  .back { padding: 24px 32px 28px; border-top: 1px solid var(--border); background: var(--surface-2); animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .answerhead { text-align: center; margin-bottom: 18px; }
  .answerhead .term { font-size: 30px; }
  .meaning-box { text-align: center; }
  .m-label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .m-main { margin-top: 4px; font-size: 28px; line-height: 1.25; font-weight: 650; color: var(--gold); overflow-wrap: anywhere; }
  .m-phrase { color: var(--text); }
  .engine { display: inline-block; margin-left: 8px; vertical-align: middle; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; }
  .engine.gemini { color: var(--accent-text); border-color: var(--accent); }
  .m-note { margin: 8px auto 0; max-width: 560px; font-size: 14.5px; color: var(--text-2); }
  .m-dict { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .m-dict b { color: var(--text-2); font-weight: 600; }
  .m-ctx { margin: 12px auto 0; max-width: 600px; font-size: 15.5px; font-style: italic; color: var(--text-2); }
  .sections { margin-top: 22px; display: grid; gap: 14px; }
  .section { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); text-align: left; }
  .section h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .section p { margin: 0; color: var(--text); }
  .section .syn { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .grid2 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .list li { display: flex; gap: 10px; align-items: flex-start; }
  .list .t { flex: 1; min-width: 0; }
  .list .t > div:first-child { color: var(--text); }
  .list .t small { display: block; color: var(--muted); font-size: 13.5px; }
  .play { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--raised); color: var(--text); cursor: pointer; font-size: 11px; }
  .play:hover { border-color: var(--accent); background: var(--accent-soft); }
  .own { display: flex; gap: 8px; }
  .own input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); outline: none; }
  .own input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ownResult { margin-top: 10px; display: grid; gap: 4px; font-size: 14.5px; color: var(--text-2); }
  .ownResult .ok { color: var(--green); }
  .ownResult .fix { color: var(--text); }
  .tools { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .edit { display: grid; gap: 12px; max-width: 480px; margin: 0 auto; text-align: left; }
  .edit label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .edit input { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); outline: none; }
  .edit input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--raised); cursor: pointer; font-size: 14.5px; font-weight: 550; transition: background 0.15s, border-color 0.15s, transform 0.05s; }
  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--raised); }
  .btn.danger:hover { color: var(--red); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  kbd { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid currentColor; font: 600 11px/18px "Segoe UI", system-ui, sans-serif; opacity: 0.6; text-align: center; }

  /* ---- the bar at the bottom: always in reach ---- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
  .dock-inner { max-width: 760px; margin: 0 auto; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dock .btn.primary { min-width: 240px; padding: 12px 22px; font-size: 15.5px; }
  .grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 600px; }
  .grade { display: grid; gap: 2px; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; text-align: center; transition: background 0.15s, border-color 0.15s, transform 0.05s; }
  .grade:active { transform: translateY(1px); }
  .grade .g { font-weight: 650; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
  .grade small { color: var(--muted); font-size: 12.5px; }
  #again .g { color: var(--red); }
  #again:hover { border-color: var(--red); background: var(--red-soft); }
  #good .g { color: var(--green); }
  #good:hover { border-color: var(--green); background: var(--green-soft); }
  #easy .g { color: var(--accent-text); }
  #easy:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---- nothing to do ---- */
  .empty { padding: 48px 32px; text-align: center; }
  .empty .big { font-size: 44px; line-height: 1; }
  .empty h2 { margin: 14px 0 6px; font-size: 22px; font-weight: 650; }
  .empty p { margin: 0 auto 20px; max-width: 460px; color: var(--text-2); }

  @media (max-width: 560px) {
    main { padding-top: 18px; }
    .front, .back { padding-left: 18px; padding-right: 18px; }
    .term { font-size: 32px; }
    .quote { font-size: 17px; }
    .daily { margin-left: 0; }
    .dock .btn.primary { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="icons/48.png" alt=""><h1 data-t="reviewTitle"></h1></div>
    <div id="progress"></div>
  </header>
  <div class="bar"><div id="bar"></div></div>
  <div id="stats"></div>

  <section id="card" class="card" hidden>
    <div class="front">
      <div id="top"></div>
      <div id="front"></div>
    </div>
    <div id="back" class="back" hidden></div>
  </section>

  <section id="empty" class="card empty" hidden>
    <div class="big">✓</div>
    <h2 id="emptyTitle"></h2>
    <p id="emptyText"></p>
    <button id="studyAll" class="btn" hidden data-t="studyAll"></button>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <div class="dock-inner">
    <button id="dontKnow" class="btn ghost" hidden></button>
    <button id="show" class="btn primary"></button>
    <div class="grades" id="grades" hidden>
      <button class="grade" id="again"><span class="g"><span data-t="again"></span><kbd>1</kbd></span><small></small></button>
      <button class="grade" id="good"><span class="g"><span data-t="good"></span><kbd>2</kbd></span><small></small></button>
      <button class="grade" id="easy"><span class="g"><span data-t="easy"></span><kbd>3</kbd></span><small></small></button>
    </div>
    <button id="countIt" class="btn ghost small" data-t="countIt" hidden></button>
  </div>
</div>

<script src="messages.js"></script>
<script src="shared.js"></script>
<script src="study.js"></script>
<script src="core.js"></script>
<script src="review.js"></script>
<!-- Text selected on this page is translated too: the content script does not run on the extension's own pages. -->
<script src="select.js"></script>
</body>
</html>
