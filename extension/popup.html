<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SceneLingo</title>
<style>
  body { width: 340px; margin: 0; padding: 14px; background: #141b23; color: #fff; font: 14px/1.4 "Segoe UI", Arial, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 17px; }
  h2 { margin: 16px 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; }
  a { color: #6cb6ff; }
  input[type=password] { font: inherit; color: #fff; background: #1b2530; border: 1px solid #46566a; border-radius: 6px; padding: 4px 8px; margin-right: 6px; }
  select, button { font: inherit; color: #fff; background: #2c3947; border: 1px solid #46566a; border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { background: #3a4a5c; }
  input[type=range] { width: 130px; margin: 0; accent-color: #1a98ff; vertical-align: middle; }
  #volumeValue, #boostValue { display: inline-block; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #1a98ff; }
  #words { max-height: 260px; overflow-y: auto; border: 1px solid #2c3947; border-radius: 8px; }
  .word { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-bottom: 1px solid #222c37; }
  .word:last-child { border-bottom: 0; }
  .word-main { flex: 1; min-width: 0; }
  .word b { font-size: 15px; }
  .tr { color: #ffe08a; }
  .ctx { font-size: 12px; color: #8fa3b5; }
  .del { padding: 0 7px; }
  .empty { padding: 12px; color: #8fa3b5; text-align: center; }
  #review { width: 100%; margin: 4px 0 8px; padding: 7px; background: #1a6fd6; border-color: #1a98ff; }
  #review:hover { background: #1f7fee; }
  .kind { margin-left: 6px; font-size: 11px; color: #8fa3b5; }
  .note { margin-top: 12px; font-size: 12px; color: #8fa3b5; }
  .sites { font-size: 12px; color: #8fa3b5; }
  #siteRow[hidden] { display: none; }
  #siteHost { font-weight: 600; overflow-wrap: anywhere; }
  #activate { width: 100%; margin: 4px 0; }
  #siteNote:empty { display: none; }
  #engineGet { width: 100%; margin: 6px 0 2px; }
  #engineGet[hidden] { display: none; }
  #diagnose { width: 100%; margin-top: 10px; font-size: 12px; color: #8fa3b5; background: none; border-color: transparent; }
  #diagnose:hover { background: #222c37; }
</style>
</head>
<body>
  <h1>SceneLingo</h1>
  <label class="row"><span data-t="dual"></span><input type="checkbox" id="enabled"></label>
  <div class="row"><span data-t="learnLang"></span><select id="learnLang"></select></div>
  <div class="row"><span data-t="nativeLang"></span><select id="nativeLang"></select></div>
  <div class="row"><span data-t="uiLang"></span><select id="uiLang"></select></div>
  <div class="row" data-t-title="boostTip"><span data-t="boost"></span><span><input type="range" id="boost" min="100" max="600" step="10" value="100"><span id="boostValue">100%</span></span></div>
  <div class="sites" id="boostNote"></div>
  <div class="row"><span data-t="volume"></span><span><input type="range" id="volume" min="0" max="300" step="10"><span id="volumeValue"></span></span></div>
  <label class="row"><span data-t="preferHuman"></span><input type="checkbox" id="preferHuman"></label>
  <label class="row" data-t-title="selectLookupTip"><span data-t="selectLookup"></span><input type="checkbox" id="selectLookup"></label>

  <h2><span data-t="headEngine"></span></h2>
  <div class="sites" id="engineState"></div>
  <button id="engineGet" hidden></button>

  <h2><span data-t="headGemini"></span></h2>
  <div class="sites" data-t="geminiNote"></div>
  <label class="row"><span data-t="useGemini"></span><input type="checkbox" id="useGemini"></label>
  <div class="row"><input type="password" id="geminiKey" autocomplete="off" spellcheck="false" data-t-placeholder="geminiKeyPh" style="flex:1;min-width:0"><button id="geminiSave" data-t="geminiSave"></button></div>
  <div class="sites"><span id="geminiState"></span> <button id="geminiRemove" hidden data-t="geminiRemove"></button></div>
  <div class="sites"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-t="geminiGetKey"></a></div>

  <h2><span data-t="headSites"></span></h2>
  <div class="sites" data-t="sitesNote"></div>
  <label class="row"><span data-t="everywhere"></span><input type="checkbox" id="everywhere"></label>
  <label class="row" id="siteRow" hidden><span><span data-t="siteOn"></span> <b id="siteHost"></b></span><input type="checkbox" id="siteOn"></label>
  <button id="activate" data-t="activate" data-t-title="activateTip"></button>
  <div class="sites" id="siteNote"></div>

  <h2><span id="wordsHead"></span><button id="export" data-t="exportCsv"></button></h2>
  <button id="review"></button>
  <div id="words"></div>

  <div class="note" data-t="popupNote"></div>
  <button id="diagnose" data-t="copyDiag" data-t-title="diagTip"></button>
  <script src="messages.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
