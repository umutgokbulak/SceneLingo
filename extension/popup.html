<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; margin: 0; padding: 14px 14px 10px; font-size: 14px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 26px; height: 26px; border-radius: 7px; }
  h1 { margin: 0; flex: 1; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .dual { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }

  /* a switch, for every on and off */
  input.switch { appearance: none; width: 34px; height: 20px; margin: 0; border-radius: 999px; background: var(--border-strong); position: relative; cursor: pointer; flex: none; transition: background 0.15s; }
  input.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  input.switch:checked { background: var(--accent); }
  input.switch:checked::after { transform: translateX(14px); }
  input.switch:disabled { opacity: 0.4; cursor: default; }
  input.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* today */
  .today { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .today .big { display: flex; align-items: baseline; gap: 8px; }
  .today .big b { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .today .big span { color: var(--text-2); font-size: 13.5px; }
  .today .btn.primary { width: 100%; margin-top: 10px; padding: 10px; font-size: 14.5px; }
  .todayhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  #streak { font-size: 12.5px; color: var(--gold); font-weight: 650; }
  #plan .sl-step { padding: 5px 8px; }
  .today .links { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .today .links .btn { min-width: 0; }
  .today .links .warn { grid-column: 1 / -1; }
  .today .cloudline { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .today .cloudline svg.i { color: var(--accent-text); }
  .warn { color: var(--gold) !important; border-color: color-mix(in srgb, var(--gold) 40%, transparent) !important; }

  /* sections */
  section { margin-top: 14px; }
  h2 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .rows { border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--border); min-height: 40px; }
  .row:first-child { border-top: 0; }
  .row > span:first-child { flex: 1; min-width: 0; color: var(--text); }
  label.row { cursor: pointer; }
  .row select { max-width: 160px; }
  .slider { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 120px; margin: 0; accent-color: var(--accent); }
  .val { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 13px; }
  .hint { padding: 0 12px 9px; font-size: 12px; color: var(--muted); }
  .hint:empty { display: none; }
  .rows .btn { width: calc(100% - 24px); margin: 0 12px 10px; }
  .rows .keyrow .btn, .rows .hint .btn { width: auto; margin: 0; flex: none; }
  #engineGet[hidden], #siteRow[hidden] { display: none; }

  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '›'; font-size: 15px; transition: transform 0.15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details .rows { margin-top: 6px; }
  .keyrow { display: flex; gap: 6px; padding: 0 12px 10px; }
  .keyrow input { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); outline: none; font-size: 13px; }
  .keyrow input:focus { border-color: var(--accent); }
  a { color: var(--accent-text); }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  footer .btn { font-size: 12px; padding: 4px 8px; }
</style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <h1>SceneLingo</h1>
    <label class="dual"><span data-t="dual"></span><input type="checkbox" class="switch" id="enabled"></label>
  </header>

  <div class="today">
    <div class="todayhead"><span class="label" data-t="planTitle"></span><span id="streak"></span></div>
    <div id="plan"></div>
    <div class="links">
      <button id="allWords" class="btn small"></button>
      <button id="progress" class="btn small" data-t="progressTitle"></button>
      <button id="backupDue" class="btn small warn" hidden></button>
    </div>
    <div class="cloudline" id="cloudLine"></div>
  </div>

  <section>
    <h2 data-t="headLangs"></h2>
    <div class="rows">
      <div class="row"><span data-t="learnLang"></span><select id="learnLang"></select></div>
      <div class="row"><span data-t="nativeLang"></span><select id="nativeLang"></select></div>
      <div class="hint" id="engineState"></div>
      <button id="engineGet" class="btn small" hidden></button>
    </div>
  </section>

  <section>
    <h2 data-t="headSound"></h2>
    <div class="rows">
      <div class="row" data-t-title="boostTip"><span data-t="boost"></span><span class="slider"><input type="range" id="boost" min="100" max="600" step="10" value="100"><span class="val" id="boostValue">100%</span></span></div>
      <div class="hint" id="boostNote"></div>
      <div class="row"><span data-t="volume"></span><span class="slider"><input type="range" id="volume" min="0" max="300" step="10"><span class="val" id="volumeValue"></span></span></div>
    </div>
  </section>

  <section>
    <h2 data-t="headSites"></h2>
    <div class="rows">
      <label class="row" id="siteRow" hidden><span><span data-t="siteOn"></span> <b id="siteHost"></b></span><input type="checkbox" class="switch" id="siteOn"></label>
      <label class="row" data-t-title="sitesNote"><span data-t="everywhere"></span><input type="checkbox" class="switch" id="everywhere"></label>
      <div class="hint" id="siteNote"></div>
      <button id="activate" class="btn small" data-t="activate" data-t-title="activateTip"></button>
    </div>
  </section>

  <details>
    <summary data-t="moreSettings"></summary>
    <div class="rows">
      <div class="row"><span data-t="uiLang"></span><select id="uiLang"></select></div>
      <label class="row"><span data-t="preferHuman"></span><input type="checkbox" class="switch" id="preferHuman"></label>
      <label class="row" data-t-title="selectLookupTip"><span data-t="selectLookup"></span><input type="checkbox" class="switch" id="selectLookup"></label>
    </div>
    <div class="rows" style="margin-top: 10px">
      <label class="row"><span data-t="headGemini"></span><input type="checkbox" class="switch" id="useGemini"></label>
      <div class="hint" data-t="geminiNote"></div>
      <div class="keyrow"><input type="password" id="geminiKey" autocomplete="off" spellcheck="false" data-t-placeholder="geminiKeyPh"><button id="geminiSave" class="btn small" data-t="geminiSave"></button></div>
      <div class="hint"><span id="geminiState"></span> <button id="geminiRemove" class="btn small ghost" hidden data-t="geminiRemove"></button></div>
      <div class="hint" id="geminiUse"></div>
      <div class="hint"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-t="geminiGetKey"></a></div>
    </div>
  </details>

  <footer>
    <button id="welcome" class="btn ghost" data-t="welcomeOpen"></button>
    <button id="diagnose" class="btn ghost" data-t="copyDiag" data-t-title="diagTip"></button>
  </footer>
  <script src="messages.js"></script>
  <script src="shared.js"></script>
  <script src="study.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
