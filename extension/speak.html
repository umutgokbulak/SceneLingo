<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneLingo</title>
<link rel="stylesheet" href="ui.css?v=0.20.2">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/128.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SceneLingo">
<meta name="theme-color" content="#0d1117">
<style>
  .app { max-width: 860px; margin: 0 auto; padding: 14px 22px 28px; display: grid; gap: 16px; }

  /* ---- the bar on top ---- */
  .topbar { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  .topbar a.btn { text-decoration: none; }

  .stack { display: grid; gap: 16px; }
  .card { border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .inner { padding: 26px 32px; }
  h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
  .sub { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
  .muted { color: var(--muted); }

  /* ---- choosing ---- */
  .notice { padding: 14px 18px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); background: var(--gold-soft); color: var(--text); font-size: 14px; }
  .sechead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 14px; }
  .sechead h2 { margin: 0; }
  .sechead label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .tile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; text-align: left; font-size: 14px; font-weight: 600; transition: border-color 0.15s, background 0.15s, transform 0.05s; }
  .tile:hover { border-color: var(--accent); background: var(--accent-soft); }
  .tile:active { transform: translateY(1px); }
  .tile:disabled { opacity: 0.5; cursor: default; }
  .tile .ic { font-size: 22px; line-height: 1; }
  .tile small { display: block; margin-top: 2px; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .tiles.parts { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .tiles.parts .tile { display: block; }
  .tiles.parts .tile b { font-size: 15px; }
  .last { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .last b { color: var(--text); }

  /* ---- shared by both kinds of practice ---- */
  .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
  .head .spacer { flex: 1; }
  .round { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 16px; flex: none; }
  .round:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
  .round.small { width: 30px; height: 30px; font-size: 14px; }
  .try { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .try span { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .try span.ok { background: var(--green-soft); color: var(--green); }

  .composer { margin-top: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
  .mic { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-size: 26px; box-shadow: 0 6px 18px var(--accent-soft); transition: transform 0.1s, background 0.15s; }
  .mic:hover { filter: brightness(1.08); }
  .mic:disabled { opacity: 0.4; cursor: default; }
  .mic.on { background: var(--red); box-shadow: 0 0 0 6px var(--red-soft); animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 50% { box-shadow: 0 0 0 12px var(--red-soft); } }
  textarea { display: block; width: 100%; box-sizing: border-box; min-height: 110px; padding: 12px 14px; font-size: 16.5px; line-height: 1.5; border-radius: 12px; border: 1.5px solid var(--border-strong); background: var(--surface-2); outline: none; resize: vertical; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .status { min-height: 18px; margin-top: 6px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status.rec { color: var(--red); }
  .actions { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 14px 32px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 18px 18px; }
  .actions .spacer { flex: 1; }
  .actions kbd { margin-left: 4px; }

  /* ---- IELTS ---- */
  .question { display: flex; align-items: flex-start; gap: 12px; margin-top: 14px; }
  .question .q { flex: 1; font-size: clamp(21px, 2.3vw, 26px); line-height: 1.3; font-weight: 650; letter-spacing: -0.01em; }
  .points { margin: 10px 0 0; padding-left: 22px; color: var(--text-2); font-size: 15.5px; line-height: 1.6; }
  .points li::marker { color: var(--accent-text); }
  .points li.lead { list-style: none; margin-left: -22px; color: var(--muted); }
  .clock { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: var(--raised); font-size: 14px; }
  .clock b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .clock .spacer { flex: 1; }
  .fb { margin-top: 22px; padding-top: 20px; border-top: 1px dashed var(--border-strong); animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bands { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
  .band { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .band small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.25; }
  .band b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .band.all { background: var(--accent-soft); border-color: transparent; min-width: 92px; }
  .band.all b { font-size: 30px; color: var(--accent-text); }
  .summary { margin-top: 14px; font-size: 15px; color: var(--text); }
  .block { margin-top: 18px; }
  .block > .label { margin-bottom: 6px; }
  .fix { padding: 8px 0; border-top: 1px solid var(--border); font-size: 15px; }
  .fix s { color: var(--red); text-decoration-thickness: 1px; }
  .fix .to { color: var(--green); font-weight: 600; }
  .fix small { display: block; color: var(--muted); font-size: 13px; }
  .model { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border-left: 3px solid var(--green); font-size: 15.5px; line-height: 1.6; }
  .model p { flex: 1; margin: 0; }
  .phrase { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 15px; }
  .phrase b { font-weight: 650; }
  .phrase span { color: var(--gold); }
  .star { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 17px; }
  .star:hover { background: var(--raised); color: var(--gold); }
  .star.on { color: var(--gold); }
  .used { padding: 6px 0; border-top: 1px solid var(--border); font-size: 14.5px; }
  .used .yes { color: var(--green); font-weight: 650; }
  .used .no { color: var(--muted); font-weight: 650; }
  .used small { display: block; color: var(--text-2); font-size: 13px; }

  /* ---- a conversation ---- */
  .chat { display: grid; gap: 12px; margin-top: 16px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 16px; line-height: 1.45; animation: rise 0.2s ease-out; }
  .msg.them { justify-self: start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .msg.me { justify-self: end; background: var(--accent-soft); border-bottom-right-radius: 6px; }
  .msg .tools { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .msg .tr { margin-top: 6px; font-size: 14px; font-style: italic; color: var(--text-2); }
  .link { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; background: none; color: var(--accent-text); cursor: pointer; font-size: 12.5px; }
  .link:hover { text-decoration: underline; }
  .corr { justify-self: end; max-width: 82%; margin-top: -6px; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
  .corr.ok { color: var(--green); background: var(--green-soft); }
  .corr.fix { background: var(--gold-soft); color: var(--text); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; }
  .corr.fix b { color: var(--gold); font-weight: 650; }
  .corr small { display: block; color: var(--text-2); font-size: 12.5px; }
  .typing { justify-self: start; color: var(--muted); font-size: 14px; }
  .ended { text-align: center; color: var(--muted); font-size: 14px; padding: 6px 0; }

  /* ---- the end of a test ---- */
  .end { text-align: center; }
  .end .big { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent-text); font-variant-numeric: tabular-nums; }
  .end .bands { max-width: 560px; margin: 16px auto 0; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: left; }
  .end .list { max-width: 620px; margin: 20px auto 0; display: grid; gap: 6px; text-align: left; }
  .end .list div { display: grid; grid-template-columns: 52px 1fr; gap: 10px; font-size: 14px; color: var(--text-2); }
  .end .list b { color: var(--text); font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

  @media (max-width: 640px) {
    .app { padding: 12px 12px 16px; }
    .topbar a.btn .t { display: none; }
    .inner { padding: 20px 16px; }
    .actions { padding: 12px 16px; }
    .actions .btn.primary { flex: 1; }
    .actions kbd { display: none; }
    .composer { grid-template-columns: minmax(0, 1fr); }
    .composer .mic { justify-self: center; }
    .bands { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .band.all { grid-column: 1 / -1; }
    .msg, .corr { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="icons/48.png" alt=""><h1 data-t="speakTitle"></h1></div>
    <a id="toHome" class="btn small ghost" href="#" hidden></a>
    <a id="toReview" class="btn small ghost" href="review.html"></a>
    <a id="toWords" class="btn small ghost" href="words.html"></a>
  </header>

  <!-- what to practise -->
  <div id="home" class="stack" hidden>
    <div id="noKey" class="notice" hidden></div>
    <section class="card"><div class="inner">
      <div class="sechead">
        <div><h2 data-t="speakDaily"></h2><p class="sub" style="margin: 0;" data-t="speakDailySub"></p></div>
        <label><span data-t="speakLevel"></span><select id="level"></select></label>
      </div>
      <div class="tiles" id="scenes"></div>
    </div></section>
    <section class="card" id="ieltsBox" hidden><div class="inner">
      <h2>IELTS Speaking</h2>
      <p class="sub" data-t="speakIeltsSub"></p>
      <div class="tiles parts" id="parts"></div>
      <div class="last" id="last"></div>
    </div></section>
  </div>

  <!-- the IELTS test -->
  <section id="exam" class="card" hidden>
    <div class="inner">
      <div class="head" id="examHead"></div>
      <div class="question"><div class="q" id="question"></div><button id="askAgain" class="round"></button></div>
      <ul class="points" id="points" hidden></ul>
      <div class="clock" id="clock" hidden></div>
      <div class="try" id="examTry" hidden></div>
      <div class="composer">
        <button id="examMic" class="mic"></button>
        <div><textarea id="examText" spellcheck="false" data-t-placeholder="speakPlaceholder"></textarea><div class="status" id="examStatus"></div></div>
      </div>
      <div id="fb" class="fb" hidden></div>
    </div>
    <div class="actions">
      <button id="skip" class="btn ghost" data-t="speakSkip"></button>
      <span class="spacer"></span>
      <button id="examGo" class="btn primary"></button>
    </div>
  </section>

  <!-- a conversation -->
  <section id="talk" class="card" hidden>
    <div class="inner">
      <div class="head" id="talkHead"></div>
      <div class="try" id="talkTry" hidden></div>
      <div class="chat" id="chat"></div>
      <div class="composer" id="talkComposer">
        <button id="talkMic" class="mic"></button>
        <div><textarea id="talkText" spellcheck="false" style="min-height: 76px;" data-t-placeholder="speakPlaceholder"></textarea><div class="status" id="talkStatus"></div></div>
      </div>
    </div>
    <div class="actions">
      <button id="talkEnd" class="btn ghost" data-t="speakFinish"></button>
      <span class="spacer"></span>
      <button id="talkGo" class="btn primary"></button>
    </div>
  </section>

  <section id="end" class="card end" hidden><div class="inner" id="endBody"></div></section>
</div>

<!-- On the phone, where there is no extension, this stands in for it. -->
<script src="web.js?v=0.20.2"></script>
<script src="messages.js?v=0.20.2"></script>
<script src="shared.js?v=0.20.2"></script>
<script src="study.js?v=0.20.2"></script>
<script src="cloud.js?v=0.20.2"></script>
<script src="gemini.js?v=0.20.2"></script>
<script src="ui.js?v=0.20.2"></script>
<script src="speak-data.js?v=0.20.2"></script>
<script src="speak.js?v=0.20.2"></script>
<!-- Text selected on this page is translated too: the content script does not run on the extension's own pages. -->
<script src="select.js?v=0.20.2"></script>
</body>
</html>
