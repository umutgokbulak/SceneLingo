<!doctype html>
<html><head><meta charset="utf-8"><title>Harness Movie</title>
<style>
html,body{margin:0;height:100%;background:#000}
#player{position:fixed;inset:0}
video{width:100%;height:100%;background:#123}
.atvwebplayersdk-captions-overlay{position:absolute;bottom:4%;left:0;right:0;text-align:center;color:#f0f;font-size:20px}
/* A drawn backdrop for screenshots, so no real film frame is needed. */
.demo #player{background:
  linear-gradient(#000 0 0) top/100% 7% no-repeat, linear-gradient(#000 0 0) bottom/100% 7% no-repeat,
  radial-gradient(ellipse 70% 22% at 50% 100%, rgba(6,8,18,.96) 0, transparent 100%),
  radial-gradient(circle at 72% 38%, #ffd9a0 0, #f2a65a 5%, #c5644f 16%, #6b3a5e 36%, #2a2346 60%, #0d0f1f 100%)}
.demo video{background:transparent}
/* ?page: the video is set into a page that scrolls, like the trailer on a title's page. */
.page body{height:300vh}
.page #player{position:absolute;inset:0 0 auto;height:84vh}
</style>
<script>
// The site the page stands in for: ?site=youtube or ?site=other; Prime Video unless told otherwise.
document.documentElement.dataset.scenelingoSite = new URLSearchParams(location.search).get('site') || 'prime';
</script>
<script src="/test/mock-chrome.js"></script>
<script src="/extension/inject.js"></script>
<link rel="stylesheet" href="/extension/content.css">
<script src="/extension/shared.js"></script>
<script src="/extension/core.js"></script>
<script src="/extension/subtitles.js"></script>
<script src="/extension/content.js"></script>
</head><body>
<!-- Mimics the parts of the Prime Video player the extension relies on. -->
<div id="player"><video src="/test/silence.wav" muted></video>
<div class="atvwebplayersdk-captions-overlay"><span class="atvwebplayersdk-captions-text"></span></div></div>
<script>
const v = document.querySelector('video');
const params = new URLSearchParams(location.search);
// ?site=other&tracks: a plain video that brings its own subtitles as <track> elements.
if (params.has('tracks')) {
  for (const [lang, label] of [['en', 'English'], ['tr', 'Türkçe']]) {
    const t = document.createElement('track');
    Object.assign(t, { kind: 'subtitles', srclang: lang, label, src: '/test/subs/' + lang + '.vtt' });
    v.appendChild(t);
  }
}
// ?site=other&hls: a player that streams. It fetches the stream's master playlist, as players
// do, and draws nothing of its own; the subtitle tracks are named in that playlist only.
if (params.has('hls')) fetch('/test/hls/master.m3u8').then((r) => r.text());
// ?site=other&dash: the same for a stream described the other common way.
if (params.has('dash')) fetch('/test/hls/film.mpd').then((r) => r.text());
// &shadow: a player built as a custom element, with the video inside its shadow tree.
if (params.has('shadow')) {
  const shell = document.createElement('demo-player');
  shell.style.cssText = 'position:absolute;inset:0;display:block';
  v.before(shell);
  shell.attachShadow({ mode: 'open' }).appendChild(v);
  v.style.cssText = 'width:100%;height:100%;background:#123';
}
// Stands in for the file dialog: the next subtitle file "chosen" is window.nextFile = [name, text].
const fileClick = HTMLInputElement.prototype.click;
HTMLInputElement.prototype.click = function () {
  if (this.type !== 'file' || !window.nextFile) return fileClick.call(this);
  const chosen = new DataTransfer();
  chosen.items.add(new File([window.nextFile[1]], window.nextFile[0]));
  this.files = chosen.files;
  this.dispatchEvent(new Event('change'));
};
// window.showPlayer(true) opens the "player" over the page, showPlayer(false) goes back to the page.
window.showPlayer = (on) => document.documentElement.classList.toggle('page', !on);
if (new URLSearchParams(location.search).has('page')) window.showPlayer(false);
// The player asking for its playback resources, by fetch or by XHR.
// ?caps picks the title whose captions are in capitals and whose translation is cut differently.
const resources = '/test/api/GetPlaybackResources' + (new URLSearchParams(location.search).has('caps') ? '-caps' : '') + '.json';
window.loadTitle = (viaXhr) => {
  if (!viaXhr) return fetch(resources).then(r => r.json());
  const x = new XMLHttpRequest(); x.open('GET', resources); x.send();
};
// A player that keeps its own idea of playing/paused and re-applies it when a seek completes,
// as streaming players tend to. Enabled with ?strict.
if (new URLSearchParams(location.search).has('strict')) {
  let sitePlaying = false;
  v.addEventListener('play', () => { if (!v.seeking) sitePlaying = true; });
  v.addEventListener('pause', () => { if (!v.seeking) sitePlaying = false; });
  v.addEventListener('seeked', () => { if (!sitePlaying) v.pause(); });
  // It also moves the keyboard focus to one of its own controls whenever playback starts or stops,
  // and counts the key presses that reach it.
  const control = document.createElement('button');
  control.id = 'site-control';
  control.textContent = 'site control';
  control.style.cssText = 'position:fixed;top:12px;right:12px;z-index:5';
  document.getElementById('player').appendChild(control);
  for (const type of ['play', 'pause']) v.addEventListener(type, () => setTimeout(() => control.focus(), 0));
  // It cancels mouse presses and text selection anywhere on the page, as players do to keep the
  // picture from being selected or dragged.
  document.addEventListener('mousedown', (e) => e.preventDefault(), true);
  document.addEventListener('selectstart', (e) => e.preventDefault(), true);
  window.siteKeys = [];
  document.addEventListener('keydown', (e) => window.siteKeys.push(e.code));
  // Some of its shortcuts act when the key is released or on the key press event.
  window.siteReleases = [];
  for (const type of ['keyup', 'keypress']) document.addEventListener(type, (e) => window.siteReleases.push(type + ' ' + e.code));
}
// Stand-ins for the microphone, so speaking practice can run without one. `mockSpeech` says what
// the recogniser hears next; the "microphone" is a tone, which gives a real recording to play back.
window.mockSpeech = { say: '', alternatives: [], error: '', delay: 500 };
window.SpeechRecognition = window.webkitSpeechRecognition = class {
  start() {
    this.t = setTimeout(() => this.deliver(), window.mockSpeech.delay);
    setTimeout(() => this.onstart && this.onstart(), 0);
  }
  deliver() {
    if (this.done) return;
    this.done = true;
    clearTimeout(this.t);
    const m = window.mockSpeech;
    if (m.error) this.onerror && this.onerror({ error: m.error });
    else if (m.say) {
      const result = Object.assign([m.say].concat(m.alternatives).map(transcript => ({ transcript, confidence: 0.9 })), { isFinal: true });
      this.onresult && this.onresult({ results: [result], resultIndex: 0 });
    }
    if (m.error || !m.say) setTimeout(() => this.onend && this.onend(), 0);
  }
  stop() { this.deliver(); setTimeout(() => this.onend && this.onend(), 0); }
  abort() { this.done = true; clearTimeout(this.t); }
};
navigator.mediaDevices.getUserMedia = async () => {
  const ctx = new AudioContext();
  const tone = ctx.createOscillator();
  const out = ctx.createMediaStreamDestination();
  tone.connect(out);
  tone.start();
  return out.stream;
};
// Pretend the player's own captions run `shift` seconds behind the video clock.
window.simulateNative = (shift) => fetch('/test/subs/en.ttml2?native').then(r => r.text()).then(t => {
  const cues = [...new DOMParser().parseFromString(t, 'application/xml').getElementsByTagNameNS('*', 'p')].map(p => {
    const sec = s => s.split(':').reduce((a, b) => a * 60 + parseFloat(b), 0);
    return { s: sec(p.getAttribute('begin')), e: sec(p.getAttribute('end')), t: p.textContent };
  });
  clearInterval(window.__nat);
  window.__nat = setInterval(() => { const ct = v.currentTime - shift; const c = cues.find(c => c.s <= ct && c.e > ct);
    document.querySelector('.atvwebplayersdk-captions-text').textContent = c ? c.t : ''; }, 30);
});
</script>
<script src="/test/demo.js"></script>
</body></html>
