<!doctype html>
<!-- Source of the extension icon; rendered to extension/icons/*.png with headless Chrome. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .icon { --s: 128px; width: var(--s); height: var(--s); border-radius: calc(var(--s) * 0.22); box-sizing: border-box;
    background: linear-gradient(145deg, #2a2346, #0f1626 70%); display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; gap: calc(var(--s) * 0.07); padding-bottom: calc(var(--s) * 0.2); position: relative; overflow: hidden; }
  .icon::before { content: ""; position: absolute; width: 46%; height: 46%; right: 12%; top: 10%; border-radius: 50%;
    background: radial-gradient(circle, #ffd9a0 0, #f2a65a 45%, rgba(197, 100, 79, 0) 72%); }
  .bar { height: calc(var(--s) * 0.115); border-radius: calc(var(--s) * 0.06); position: relative; }
  .a { width: 68%; background: #fff; }
  .b { width: 48%; background: #ffd65a; }
</style>
<div class="icon" id="i"><div class="bar a"></div><div class="bar b"></div></div>
<script>document.getElementById('i').style.setProperty('--s', (new URLSearchParams(location.search).get('s') || 128) + 'px');</script>
