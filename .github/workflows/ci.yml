name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: for f in extension/*.js test/*.js test/unit/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Type check (TypeScript on the plain JavaScript; nothing is built)
        run: npm run typecheck
